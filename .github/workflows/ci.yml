name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  verify:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (WebKitGTK for Tauri Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npm test

      - name: Frontend Build
        run: npm run build:web

      # Tauri's build script fails hard when `bundle > externalBin` has no
      # `bin/opencode-<target-triple>` staged, so this must run before cargo.
      - name: Stage pinned OpenCode core
        run: ./scripts/setup-core.sh src-tauri/bin

      - name: Rust Cargo Check & Test
        run: |
          cd src-tauri
          cargo check
          cargo test

      - name: Stage OpenCode binary for integration test
        run: |
          mkdir -p /tmp/kilo/oc
          cp src-tauri/bin/opencode /tmp/kilo/oc/opencode

      - name: Integration Test (Core + Mock Provider)
        run: ./scripts/test-integration.sh

  # Code behind `#[cfg(target_os = ...)]` is not type-checked on Linux, so a
  # Windows- or macOS-only API mistake can reach a release tag unchallenged.
  platform-check:
    name: Rust Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Stage pinned OpenCode core
        shell: bash
        run: ./scripts/setup-core.sh src-tauri/bin

      - name: Cargo Check
        run: cargo check --manifest-path src-tauri/Cargo.toml
