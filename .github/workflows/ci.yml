name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  verify:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (WebKitGTK for Tauri Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npm test

      - name: Frontend Build
        run: npm run build:web

      - name: Rust Cargo Check & Test
        run: |
          cd src-tauri
          cargo check
          cargo test

      - name: Download pinned OpenCode binary for integration test
        run: |
          mkdir -p /tmp/kilo/oc
          curl -sL -o /tmp/kilo/oc/oc.tar.gz "https://github.com/anomalyco/opencode/releases/download/v1.18.30/opencode-linux-x64.tar.gz"
          cd /tmp/kilo/oc && tar xzf oc.tar.gz

      - name: Integration Test (Core + Mock Provider)
        run: ./scripts/test-integration.sh
