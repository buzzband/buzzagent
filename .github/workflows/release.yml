          files: |
            releases/BuzzAgent_*_amd64.AppImage
            releases/BuzzAgent_*_amd64.deb
            releases/buzzagent-*-1.x86_64.rpm
            releases/SHA256SUMS.txt
          fail_on_unmatched_files: true
