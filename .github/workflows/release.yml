name: Release

# One command for users: push a tag, get installers for Windows, macOS
# (Apple Silicon + Intel) and Linux attached to a GitHub Release. This is how
# `npm run dist` results reach non-developer users.
#
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon (arm64 runner)
            target: aarch64-apple-darwin
          # Intel uses the dedicated macOS-13 pool: native x86_64 and a
          # separate runner label, so the two macOS builds do not compete for
          # the same (capacity-constrained) arm64 runners.
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: ""
          - os: ubuntu-22.04
            target: ""

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install system dependencies (WebKitGTK for Tauri Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm libfuse2

      - name: Install npm dependencies
        run: npm ci

      - name: Download pinned OpenCode core
        shell: bash
        # Pass the build target: an Apple Silicon runner building the Intel
        # bundle must stage the x86_64 sidecar, not just its own.
        run: ./scripts/setup-core.sh src-tauri/bin ${{ matrix.target }}

      - name: Build frontend
        run: npm run build:web

      - name: Build and release (macOS, Windows)
        if: matrix.os != 'ubuntu-22.04'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: "BuzzAgent ${{ github.ref_name }}"
          releaseBody: |
            > **The 0.2.\* series runs on OpenCode v2.0** (bundled sidecar **2.0.32**):
            > new `/api` server layer, v2 config schema (`providers`/`settings`,
            > `agents`/`system`), credential-based provider auth and the v2 event
            > stream. Existing v1 settings and provider keys migrate automatically
            > on first launch.

            ## Fixed in 0.2.5
            - **CI reliability (no app changes)**: the Intel macOS installer now
              builds on the dedicated `macos-13` runner instead of competing for
              the capacity-constrained arm64 pool, and the macOS Rust check uses
              the same pool. GitHub runner shortages ("job was not acquired")
              and their API "Internal server error" are infrastructure-side —
              re-run failed jobs if they appear.

            ## Fixed in 0.2.4
            - **Windows / macOS build fix**: the exit cleanup's `try_lock`
              temporary outlived its borrow on platforms without the Unix-only
              kill line (E0597) — the Windows Rust Check and installer build
              failed. Scoped with a semicolon; all platforms compile again.

            ## Fixed in 0.2.3
            - **Custom provider "requires an endpoint baseURL"**: the provider
              editor and the reasoning chip read the old v1 config key, so
              editing a provider could save an empty base URL. They now read the
              v2 `settings` block, the backend refuses to overwrite a stored
              URL with an empty one, and the dialog requires the field.
            - **Errors are always the last thing in the chat**: the error card
              is pinned directly above the composer in every state, so it can
              never be scrolled out of view at the top.
            - **Notifications on failure**: a failed turn now plays the
              completion sound and sends the desktop + ntfy notification (once
              per turn). The success chime was also fixed — it had stopped
              firing because event ordering cleared the busy state first.
            - **Closing the app no longer leaves processes behind**: the exit
              path no longer blocks on async cleanup or a Chrome shutdown call;
              it kills the core's process group and every remaining child
              synchronously before exiting.

            ## Fixed in 0.2.2
            - **Reasoning chip** now shows the actual thinking level
              (e.g. `reasoning · max`) instead of the confusing `on`; enabling
              reasoning defaults to the maximum level and is persisted.
            - **The chat always shows a live status** (`Thinking Ns…`) from the
              moment a prompt is sent — OpenCode v2 has no explicit busy event,
              so a slow provider previously left the chat completely silent.
            - **New session** moved into the composer toolbar (next to the mode
              dropdown), freeing vertical space at the bottom of the chat.
            - **Mode** is now a compact dropdown instead of a row of buttons.

            ## Fixed in 0.2.1
            - **`provider.no-route — Model unavailable` with custom providers**:
              v1-style reasoning variants in the config made the v2 core silently
              drop the provider's whole model list, so every prompt failed. Custom
              providers now write the v2 variant shape
              (`[{ id, settings }]`) and existing broken configs are migrated
              automatically on startup.
            - **Error visibility**: errors now stick to the bottom edge of the chat
              (always the last visible element, never scrolled out of view) and are
              cleared when a new prompt starts.

            ## 0.2.0 highlights
            - Full migration to **OpenCode v2** (2.0.32): new API layer, v2 config
              schema, credential-based provider auth, v2 event stream.
            - Automatic **v1 → v2 migration** of existing settings and provider keys.

            Installers for Windows, macOS (Apple Silicon & Intel) and Linux.

            **Zero telemetry** 🔒 — the app talks only to your local core and the AI provider you configure.

            ## Install
            - **Windows**: download the `.msi` (or `.exe`) installer and run it
            - **macOS**: download the `.dmg` for your architecture, open and drag to Applications
            - **Linux**: download the `.AppImage` (chmod +x) or the `.deb`/`.rpm`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}

      # Linux bundles are produced by our own script instead of tauri-action:
      # the Tauri AppImage bundler runs linuxdeploy, whose patchelf pass
      # corrupts the Bun-built `opencode` sidecar (it segfaults afterwards and
      # the bundler then dies with `failed to run linuxdeploy` when ldd fails
      # on the corrupted binary). scripts/build-linux-release.sh builds the
      # AppImage with plain appimagetool, leaving the sidecar byte-identical.
      - name: Build Linux artifacts (deb, rpm, AppImage)
        if: matrix.os == 'ubuntu-22.04'
        run: ./scripts/build-linux-release.sh

      - name: Upload Linux artifacts to the GitHub release
        if: matrix.os == 'ubuntu-22.04'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "BuzzAgent ${{ github.ref_name }}"
          body: |
            > **The 0.2.\* series runs on OpenCode v2.0** (bundled sidecar **2.0.32**):
            > new `/api` server layer, v2 config schema (`providers`/`settings`,
            > `agents`/`system`), credential-based provider auth and the v2 event
            > stream. Existing v1 settings and provider keys migrate automatically
            > on first launch.

            ## Fixed in 0.2.5
            - **CI reliability (no app changes)**: the Intel macOS installer now
              builds on the dedicated `macos-13` runner instead of competing for
              the capacity-constrained arm64 pool, and the macOS Rust check uses
              the same pool. GitHub runner shortages ("job was not acquired")
              and their API "Internal server error" are infrastructure-side —
              re-run failed jobs if they appear.

            ## Fixed in 0.2.4
            - **Windows / macOS build fix**: the exit cleanup's `try_lock`
              temporary outlived its borrow on platforms without the Unix-only
              kill line (E0597) — the Windows Rust Check and installer build
              failed. Scoped with a semicolon; all platforms compile again.

            ## Fixed in 0.2.3
            - **Custom provider "requires an endpoint baseURL"**: the provider
              editor and the reasoning chip read the old v1 config key, so
              editing a provider could save an empty base URL. They now read the
              v2 `settings` block, the backend refuses to overwrite a stored
              URL with an empty one, and the dialog requires the field.
            - **Errors are always the last thing in the chat**: the error card
              is pinned directly above the composer in every state, so it can
              never be scrolled out of view at the top.
            - **Notifications on failure**: a failed turn now plays the
              completion sound and sends the desktop + ntfy notification (once
              per turn). The success chime was also fixed — it had stopped
              firing because event ordering cleared the busy state first.
            - **Closing the app no longer leaves processes behind**: the exit
              path no longer blocks on async cleanup or a Chrome shutdown call;
