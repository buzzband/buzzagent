[package]
name = "buzzagent"
version = "0.1.22"
description = "Open-source visual control center for AI coding agents — zero telemetry"
license = "MIT"
edition = "2021"
repository = "https://github.com/buzzband/buzzagent"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["protocol-asset", "devtools", "image-png", "tray-icon"] }
tauri-plugin-dialog = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
headless_chrome = "1.0"
which = "6"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
uuid = { version = "1", features = ["v4"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
